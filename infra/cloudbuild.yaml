# Google Cloud Build pipeline: builds the API image, deploys to Cloud Run, builds the Flutter admin
# web app and publishes it to a Cloud Storage bucket (static hosting behind a load balancer / CDN).
#
#   gcloud builds submit --config infra/cloudbuild.yaml \
#     --substitutions=_REGION=asia-south1,_WEB_BUCKET=gamya-admin-web,_API_URL=https://gamya-api-xxxx.a.run.app/api/v1
substitutions:
  _REGION: asia-south1
  _SERVICE: gamya-api
  _REPO: gamya
  _WEB_BUCKET: gamya-admin-web
  _API_URL: https://api.gamyamobility.com/api/v1
  _CLOUDSQL_INSTANCE: ""   # project:region:instance (optional)
  _FLUTTER_IMAGE: ghcr.io/cirruslabs/flutter:stable

steps:
  # ── Backend image ──
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest", "backend"]
  - name: gcr.io/cloud-builders/docker
    id: push-api
    args: ["push", "--all-tags", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  # ── Deploy API to Cloud Run (secrets & env come from the service's existing config / Secret Manager) ──
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy-api
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run deploy ${_SERVICE} \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA \
          --region ${_REGION} --platform managed --allow-unauthenticated \
          --port 8080 --memory 512Mi --cpu 1 --min-instances 0 --max-instances 5 \
          --set-env-vars NODE_ENV=production,STORAGE_DRIVER=gcs \
          $( [ -n "${_CLOUDSQL_INSTANCE}" ] && echo "--add-cloudsql-instances ${_CLOUDSQL_INSTANCE}" )

  # ── Admin web (Flutter) ──
  - name: ${_FLUTTER_IMAGE}
    id: build-web
    entrypoint: bash
    args:
      - -c
      - |
        cd apps/admin_web && flutter pub get && \
        flutter build web --release --dart-define=API_BASE_URL=${_API_URL}
  - name: gcr.io/cloud-builders/gsutil
    id: publish-web
    args: ["-m", "rsync", "-r", "-d", "apps/admin_web/build/web", "gs://${_WEB_BUCKET}"]
  - name: gcr.io/cloud-builders/gsutil
    id: web-cache
    entrypoint: bash
    args: ["-c", "gsutil -m setmeta -h 'Cache-Control:no-cache' gs://${_WEB_BUCKET}/index.html gs://${_WEB_BUCKET}/flutter_service_worker.js gs://${_WEB_BUCKET}/main.dart.js || true"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 2400s
