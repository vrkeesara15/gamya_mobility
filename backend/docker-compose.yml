services:
  db:
    image: postgres:16-alpine
    container_name: gamya_db
    environment:
      POSTGRES_USER: gamya
      POSTGRES_PASSWORD: gamya
      POSTGRES_DB: gamya_mobility
    ports:
      - "5433:5432"
    volumes:
      - gamya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamya -d gamya_mobility"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    container_name: gamya_api
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://gamya:gamya@db:5432/gamya_mobility?schema=public
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
volumes:
  gamya_pgdata:
